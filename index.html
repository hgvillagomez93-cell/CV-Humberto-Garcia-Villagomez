<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humberto García · CV Arcade</title> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <!-- ===== LIBRERÍAS PARA PDF ===== -->
    <!-- html2canvas: convierte HTML a imagen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- jsPDF: genera PDF desde JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- html2pdf: wrapper que combina las dos anteriores -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <!-- PANTALLA DE BIENVENIDA -->
    <div id="welcome">
        <div class="welcome-content">
            <img src="foto.jpg" alt="Humberto García" class="welcome-img">
            <h1 id="welcome-name"></h1>
            <p class="welcome-sub">Ingeniero en Automatización</p>
            <p class="welcome-hint">— Haz clic para continuar —</p>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="app" style="display: none;">
        <header id="header">
            <div class="header-flex">
                <img src="foto.jpg" alt="Foto de Humberto" class="foto-perfil" id="foto-perfil">
                <div>
                    <h1 id="nombre"></h1>
                    <p class="subtitle">Ingeniero en Automatización</p>
                </div>
            </div>
        </header>

        <main id="main">
            <!-- El contenido se genera dinámicamente con JS -->
        </main>

        <footer id="footer">
            <div class="botones-contacto">
                <a id="btn-whatsapp" href="#" target="_blank" class="btn arcade-btn btn-whatsapp">📱 WhatsApp</a>
                <a id="btn-email" href="#" class="btn arcade-btn btn-email">✉️ Gmail</a>
            </div>
            <p class="footer-message">⚡ Amo la automatización, la programación y resolver problemas ⚡</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
